function approvalChainSection(d, sol) {
  const cr    = sol?.chain;
  const chain = cr?.chain || [];
  if (!chain.length) {
    return card('Chain of approval', '<div style="color:#9ca3af;font-size:13px">No approvers required for this total.</div>');
  }
  const overallStatus = _detailStatus || d.status;

  // Compute step-level approved / rejected using the same logic as cycleApproverStatus
  const stepApproved = i => {
    const s = chain[i];
    if (s?.requiresAlternate) return !!_alternateApprovers[i] && _approvalStates[`alt-${i}`] === 'approved';
    return _approvalStates[i] === 'approved';
  };
  const stepRejected = i => {
    const s = chain[i];
    if (s?.requiresAlternate) return !!_alternateApprovers[i] && _approvalStates[`alt-${i}`] === 'rejected';
    return _approvalStates[i] === 'rejected';
  };
  const anyRejected = chain.some((_, i) => stepRejected(i));
  const allApproved = chain.length > 0 && chain.every((_, i) => stepApproved(i));

  // ── Banner ────────────────────────────────────────────────────────────────
  // Conflicts (requiresAlternate) are announced here, not per-row.
  const conflicts = chain.map((s, i) => ({ s, i })).filter(({ s }) => s.requiresAlternate);
  const unresolvedConflicts = conflicts.filter(({ i }) => !_alternateApprovers[i]);
  let banner;
  if (anyRejected || overallStatus === 'rejected') {
    banner = `<div style="font-size:12px;color:#991b1b;margin-bottom:14px;padding:8px 12px;background:#fee2e2;border:1px solid #fecaca;border-radius:5px">✗ Rejected — one or more approvers have rejected this requisition</div>`;
  } else if (allApproved || overallStatus === 'approved') {
    banner = `<div style="font-size:12px;color:#166534;margin-bottom:14px;padding:8px 12px;background:#dcfce7;border:1px solid #bbf7d0;border-radius:5px">✓ Approved — all approvers have approved this requisition</div>`;
  } else if (unresolvedConflicts.length > 0) {
    // Explain each conflict and offer "Add alternate" — one form at a time
    const conflictRows = unresolvedConflicts.map(({ s, i }) => {
      const roleName    = esc((s.role || '').replace(/_/g, ' '));
      const explanation = `<strong>${esc(s.name)}</strong> is the <em>${roleName}</em> for this cost centre but is also the requester — a requester may not approve their own requisition.`;
      const formOpen = _showAlternateForm.has(i);
      if (formOpen) {
        return `<div style="margin-top:10px">
          <div style="margin-bottom:6px;font-size:12px">${explanation}</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <input id="alt-name-${i}" type="text" placeholder="Alternate name" style="border:1px solid #d1d5db;border-radius:4px;padding:4px 8px;font-size:12px;width:140px;font-family:inherit">
            <input id="alt-email-${i}" type="email" placeholder="Email" style="border:1px solid #d1d5db;border-radius:4px;padding:4px 8px;font-size:12px;width:180px;font-family:inherit">
            <button style="font-size:11px;height:28px;padding:0 10px;background:#6366f1" onclick="confirmAlternate(${i})">Assign</button>
            <button class="ghost" style="font-size:11px;height:28px;padding:0 10px" onclick="cancelAlternateForm(${i})">Cancel</button>
          </div>
        </div>`;
      }
      return `<div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:12px">${explanation}</span>
        <button class="ghost" style="font-size:11px;height:26px;padding:0 10px;flex-shrink:0" onclick="showAlternateForm(${i})">Assign alternate approver</button>
      </div>`;
    }).join('');
    banner = `<div style="margin-bottom:14px;padding:10px 12px;background:#fef9c3;border:1px solid #fde68a;border-radius:5px">
      <strong style="font-size:12px;color:#92400e">⚠ Alternate approver required</strong>
      ${conflictRows}
    </div>`;
  } else {
    banner = `<div style="font-size:12px;color:#6b7280;margin-bottom:14px">Waiting for responses from the following approvers:</div>`;
  }

  // ── Rows ──────────────────────────────────────────────────────────────────
  const rows = [];
  chain.forEach((s, i) => {
    const alt = _alternateApprovers[i];
    if (s.requiresAlternate) {
      // Original row: always "Invalid" — requester can't approve their own requisition
      rows.push(`<tr>
        <td style="color:#9ca3af;text-decoration:line-through">${esc(s.name)}</td>
        <td style="color:#9ca3af">${esc((s.role || '').replace(/_/g, ' '))}</td>
        <td><span class="appr appr-invalid">Invalid</span></td>
        <td></td>
      </tr>`);
      // Alternate row: pending slot or assigned approver with clickable chip
      if (alt) {
        const altStatus   = _approvalStates[`alt-${i}`] || 'pending';
        const altChipCls  = altStatus === 'approved' ? 'appr-approved' : altStatus === 'rejected' ? 'appr-rejected' : 'appr-pending';
        const altChipTxt  = altStatus === 'approved' ? 'Approved' : altStatus === 'rejected' ? 'Rejected' : 'Pending';
        const remindBtn   = altStatus === 'pending'
          ? `<button class="ghost" style="font-size:12px;padding:4px 10px" onclick="remindApprover(${JSON.stringify(alt.email)},${JSON.stringify(alt.name)})">Remind</button>`
          : '';
        rows.push(`<tr>
          <td style="font-weight:500">${esc(alt.name)}</td>
          <td style="color:#6b7280"><span class="chip chip-amber" style="font-size:10px">Alternate</span></td>
          <td><span class="appr ${altChipCls}" style="cursor:pointer;user-select:none" title="Click to cycle status (demo)" onclick="cycleApproverStatus(${i},true)">${altChipTxt}</span></td>
          <td>${remindBtn}</td>
        </tr>`);
      } else {
        rows.push(`<tr>
          <td style="color:#9ca3af;font-style:italic">— pending assignment —</td>
          <td style="color:#9ca3af"><span class="chip chip-amber" style="font-size:10px">Alternate</span></td>
          <td><span class="appr appr-pending">Pending</span></td>
          <td></td>
        </tr>`);
      }
    } else {
      // Normal approver row
      const apprStatus = _approvalStates[i] || 'pending';
      const chipCls    = apprStatus === 'approved' ? 'appr-approved' : apprStatus === 'rejected' ? 'appr-rejected' : 'appr-pending';
      const chipTxt    = apprStatus === 'approved' ? 'Approved' : apprStatus === 'rejected' ? 'Rejected' : 'Pending';
      const remindBtn  = apprStatus === 'pending'
        ? `<button class="ghost" style="font-size:12px;padding:4px 10px" onclick="remindApprover(${JSON.stringify(s.email)},${JSON.stringify(s.name)})">Remind</button>`
        : '';
      rows.push(`<tr>
        <td style="font-weight:500">${esc(s.name)}</td>
        <td style="color:#6b7280">${esc((s.role || '').replace(/_/g, ' '))}</td>
        <td><span class="appr ${chipCls}" style="cursor:pointer;user-select:none" title="Click to cycle status (demo)" onclick="cycleApproverStatus(${i})">${chipTxt}</span></td>
        <td>${remindBtn}</td>
      </tr>`);
    }
  });

  return card('Chain of approval', `
    ${banner}
    <table class="data-table"><thead><tr><th>Reviewer</th><th>Role</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>
  `);
}

function remindApprover(email, name) {
  alert(`Prototype — would send a reminder email to ${name} <${email}>.`);
}

// ── Mock approval cycle ────────────────────────────────────────────────────────
// Cycles an approver's status Pending → Approved → Rejected → Pending.
// isAlt: true when clicking the alternate-approver chip (keyed as 'alt-N').
// When all required steps approve, submits the PO to the backend.
// Reads clerk-edited form values so the submit endpoint can fill in data that
// was missing in the original extraction (e.g. for needs_clarification cases).
function collectFormValues() {
  const supplier_id        = document.getElementById('input-supplier_id')?.value?.trim() || null;
  const delivery_date      = document.getElementById('input-delivery_date')?.value?.trim() || null;
  const currency           = document.getElementById('input-currency')?.value || null;
  const cost_centre_code   = document.getElementById('input-cost_centre')?.value?.trim() || null;

  // Reconstruct line items from the editable table rows.
  const line_items = [];
  document.querySelectorAll('#li-tbody tr.li-tr').forEach(row => {
    const ridx  = row.dataset.row;
    const desc  = document.getElementById(`input-li-desc-${ridx}`)?.value?.trim();
    const qty   = parseFloat(document.getElementById(`input-li-qty-${ridx}`)?.value);
    const price = parseFloat(document.getElementById(`input-li-price-${ridx}`)?.value);
    const unit  = document.getElementById(`input-li-unit-${ridx}`)?.value?.trim() || 'pcs';
    if (desc && !isNaN(qty) && qty > 0 && !isNaN(price) && price > 0) {
      line_items.push({ description: desc, quantity: qty, unit_price: price, unit });
    }
  });

  return { supplier_id, delivery_date, currency, cost_centre_code, line_items: line_items.length ? line_items : null };
}

async function cycleApproverStatus(idx, isAlt = false) {
  const key   = isAlt ? `alt-${idx}` : idx;
  const cycle = ['pending', 'approved', 'rejected'];
  const cur   = _approvalStates[key] || 'pending';
  _approvalStates[key] = cycle[(cycle.indexOf(cur) + 1) % cycle.length];
  persistApprovalState();  // fire-and-forget — survives navigation

  const d     = window._detail;
  const chain = d.resolution?.chain?.chain || [];

  // A step counts as approved only if:
  //   - it has no conflict (normal step): _approvalStates[i] === 'approved'
  //   - it has a conflict (requiresAlternate): an alternate was assigned AND
  //     _approvalStates['alt-i'] === 'approved'
  const stepApproved = i => {
    const s = chain[i];
    if (s?.requiresAlternate) return !!_alternateApprovers[i] && _approvalStates[`alt-${i}`] === 'approved';
    return _approvalStates[i] === 'approved';
  };
  const stepRejected = i => {
    const s = chain[i];
    if (s?.requiresAlternate) return !!_alternateApprovers[i] && _approvalStates[`alt-${i}`] === 'rejected';
    return _approvalStates[i] === 'rejected';
  };

  const anyRejected = chain.some((_, i) => stepRejected(i));
  const allApproved = chain.length > 0 && chain.every((_, i) => stepApproved(i));

  if (anyRejected) {
    fetch(`/api/requisition/${d.id}/reject`, { method: 'POST' })
      .catch(err => console.warn('reject persist failed:', err));
    reRenderDetail('rejected');
  } else if (allApproved && !_poSubmitted) {
    _poSubmitted = true;
    reRenderDetail('approved');  // optimistic — show approved state immediately
    try {
      // Use clerk-edited form values if available (captured at submit-for-approval time).
      // For pipeline-ready requisitions the form was never editable, so pass empty object.
      const overrides = _clerkFormValues ?? {};
      // Use fetch directly (not fetchJson) so we can distinguish fixable 422s from
      // system errors and show an actionable "Fix data" banner instead of just failing.
      const resp = await fetch(`/api/requisition/${d.id}/submit`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(overrides),
      });
      const result = await resp.json();
      if (!resp.ok) {
        _poSubmitted = false;
        if (result.fixable) {
          // A fixable data error (e.g. missing qty/price) — show the error banner
          // and let the clerk go back to the editable form to correct the data.
          _submitError = result.error;
          reRenderDetail('waiting_approval');
        } else {
          console.error('PO submission failed:', result.error);
          reRenderDetail('approved');  // keep optimistic; error logged to console
        }
        return;
      }
      if (result.poNumber) {
        window._detail = { ...window._detail, po: { po_number: result.poNumber } };
      }
    } catch (err) {
      _poSubmitted = false;
      console.error('PO submission failed:', err.message ?? err);
    }
    reRenderDetail('approved');  // re-render with PO number (or error state)
  } else if (allApproved) {
    reRenderDetail('approved');  // already submitted, just keep the state
  } else {
    reRenderDetail('waiting_approval');
  }
}

// ── Alternate approver management ─────────────────────────────────────────────

// Fire-and-forget: saves _approvalStates + _alternateApprovers to DB so they
// survive navigation and refresh. Called after every state change.
function persistApprovalState() {
  const d = window._detail;
  if (!d) return;
  fetch(`/api/requisition/${d.id}/approval-state`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ states: _approvalStates, alternates: _alternateApprovers }),
  }).catch(err => console.warn('approval state persist failed:', err));
}

function showAlternateForm(idx) {
  _showAlternateForm.add(idx);
  reRenderDetail(_detailStatus || window._detail?.status);
}
function cancelAlternateForm(idx) {
  _showAlternateForm.delete(idx);
  reRenderDetail(_detailStatus || window._detail?.status);
}
function confirmAlternate(idx) {
  const name  = document.getElementById(`alt-name-${idx}`)?.value?.trim();
  const email = document.getElementById(`alt-email-${idx}`)?.value?.trim();
  if (!name || !email) { alert('Please enter both name and email for the alternate approver.'); return; }
  _alternateApprovers[idx] = { name, email };
  _showAlternateForm.delete(idx);
  persistApprovalState();
  reRenderDetail(_detailStatus || window._detail?.status);
}

function poFormCard(d, ext, sol) {
  if (!ext && !sol) return card('Purchase Order', '<div style="color:#9ca3af;font-size:13px">No data extracted yet.</div>');
  const fc       = ext?.field_confidence || {};
  const items    = ext?.line_items || [];
  const supplier = sol?.supplier?.match;
  const costCtr  = sol?.costCentre?.match;
  const gl       = sol?.glAccount;
  const delivery = sol?.delivery;
  const currency = ext?.currency || 'CHF';
  const rawTotal = rawTotalOf(ext);
  const poNum    = d.po?.po_number;

  // Build a set of review codes so each chip can be flagged independently.
  // A blanket status-level alert (every chip yellow when needs_review) would
  // mislead: a 95%-confidence supplier chip shouldn't be amber just because
  // the delivery date is missing. Only flag the chip whose field was flagged.
  const reviewCodes = new Set((d.reviewItems || []).map(r => r.code));

  // Per-field alert levels — only 'security' (red) or 'warning' (amber) or null.
  // The overall security banner already signals the block; individual fields should
  // only be red when THEY are the specific cause (e.g. the supplier is blocked).
  // A prompt-injection flag (security_flag) doesn't make extracted fields wrong.
  const supAlert = (supplier?.status === 'blocked' || reviewCodes.has('blocked_supplier')) ? 'security'
    : (sol?.supplier?.ambiguous || reviewCodes.has('unknown_supplier') || reviewCodes.has('ambiguous_supplier')) ? 'warning'
    : null;
  const delivAlert = reviewCodes.has('missing_delivery_date') ? 'warning' : null;
  const ccAlert    = reviewCodes.has('missing_cost_centre')   ? 'warning' : null;
  const liAlert    = reviewCodes.has('no_line_items')         ? 'warning' : null;

  // Supplier display: name only — the red chip + warning below convey blocked status
  const supDisplay = supplier?.name ?? null;
  const supRaw  = supplier?.id ?? null;

  // Cost centre: display code + name, input holds code
  const ccDisplay = costCtr ? `${costCtr.code} — ${costCtr.name}` : null;
  const ccRaw     = costCtr?.code ?? null;

  // GL account: only populate if unambiguous (otherwise leave empty for ERP)
  const glMatch     = gl?.match && !gl.ambiguous ? gl.match : null;
  const glDisplay   = glMatch ? `${glMatch.code} — ${glMatch.name}` : null;
  const glRaw       = glMatch?.code ?? null;

  // Delivery date
  const deliveryDate  = delivery?.date ? delivery.date.split('T')[0] : null;
  const deliveryBasis = delivery?.basis || (delivery?.kind ? delivery.kind : null);

  // Requisition reference (stored on submitted POs, else build from id)
  const reqRef = d.po?.requisition_reference ?? (d.id ? `REQ-${d.id}` : null);

  return card('Purchase Order', `
    <div class="po-form">

      <!-- ① Vendor ───────────────────────────────────── -->
      <div class="po-group">
        <div class="po-group-title">Vendor</div>
        <div class="po-row po-row-2">
          <div>
            <div class="po-label">Supplier ID <span class="req">*</span></div>
            ${aiChip('supplier_id', supDisplay, supRaw, fc.supplier_name, 'text', 'oninput="checkSubmitButton()"', 'Supplier ID (e.g. SUP-001)', supAlert)}
            ${supplier?.status === 'blocked' ? '<div style="font-size:11px;color:#991b1b;margin-top:4px">⚠ Supplier is blocked in master data — requisition routed to security risk review.</div>' : ''}
            ${sol?.supplier?.ambiguous ? '<div style="font-size:11px;color:#92400e;margin-top:4px">⚠ Ambiguous supplier match — verify before submitting.</div>' : ''}
          </div>
          <div>
            <div class="po-label">Currency <span class="req">*</span></div>
            <select class="po-input" id="input-currency" data-prev="${esc(currency)}" onchange="updateCurrency(this.value)">
              ${['CHF','EUR','USD','GBP'].map(c => `<option value="${c}"${c===currency?' selected':''}>${c}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <!-- ② Delivery ─────────────────────────────────── -->
      <div class="po-group">
        <div class="po-group-title">Delivery</div>
        <div class="po-row po-row-1">
          <div>
            <div class="po-label">Requested delivery date <span class="req">*</span></div>
            ${aiDateChip('delivery_date', deliveryDate, deliveryBasis, delivAlert, fc.delivery_date ?? null)}
            ${!deliveryDate ? '<div style="font-size:11px;color:#92400e;margin-top:4px">No date resolved — enter a delivery date</div>' : ''}
          </div>
        </div>
      </div>

      <!-- ③ Line Items ────────────────────────────────── -->
      <div class="po-group">
        <div class="po-group-title">Line items <span class="req">*</span></div>
        <div style="padding:8px 0">
          <table class="li-table">
            <thead>
              <tr>
                <th>Description</th>
                <th>Qty</th>
                <th>Unit</th>
                <th style="text-align:right" id="li-price-header">Unit price (${esc(currency)})</th>
                <th style="text-align:right">Line total</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="li-tbody">
              ${items.length === 0
                ? `<tr><td colspan="6" style="color:#9ca3af;font-size:12px;padding:10px 6px">No line items extracted — add a row below.</td></tr>`
                : items.map((item, i) => lineItemRow(item, i, currency, true, liAlert, fc.line_items ?? null)).join('')}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="4" class="li-tfoot-label">Total</td>
                <td id="li-grand-total" class="li-tfoot-total">${esc(currency)} ${chf(rawTotal)}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
          <button class="ghost" onclick="addLineItem()" style="margin-top:10px;font-size:12px;padding:5px 12px">+ Add row</button>
        </div>
      </div>

      <!-- ④ Financial ─────────────────────────────────── -->
      <div class="po-group">
        <div class="po-group-title">Financial</div>
        <div class="po-row po-row-2">
          <div>
            <div class="po-label" id="po-total-label">Total (${esc(currency)}) <span class="req">*</span></div>
            <div class="po-total-display" id="po-financial-total">${esc(currency)} ${chf(rawTotal)}</div>
            <div style="font-size:11px;color:#9ca3af;margin-top:3px">Calculated from line items · read-only</div>
          </div>
          <div>
            <div class="po-label">Tax amount <span class="opt">(optional)</span></div>
            <input class="po-input" id="input-tax_amount" type="number" step="0.01" min="0" placeholder="0.00">
          </div>
        </div>
        <div class="po-row po-row-2">
          <div>
            <div class="po-label">Cost centre <span class="opt">(optional)</span></div>
            ${aiChip('cost_centre', ccDisplay, ccRaw, fc.cost_centre ?? null, 'text', '', 'Cost centre (e.g. CC-1001)', ccAlert)}
          </div>
          <div>
            <div class="po-label">GL account <span class="opt">(optional · ERP advisory)</span></div>
            ${aiChip('gl_account', glDisplay, glRaw, fc.category_hint ?? null, 'text', '', 'GL account (e.g. 7500)', null)}
            ${gl?.ambiguous ? '<div style="font-size:11px;color:#92400e;margin-top:4px">Ambiguous match — left blank for ERP</div>' : ''}
          </div>
        </div>
      </div>

      <!-- ⑤ Reference ─────────────────────────────────── -->
      <div class="po-group">
        <div class="po-group-title">Reference</div>
        <div class="po-row po-row-1">
          <div>
            <div class="po-label">Requisition reference <span class="opt">(optional · max 40 chars)</span></div>
            ${aiChip('req_reference', reqRef ? reqRef.slice(0,40) : null, reqRef ? reqRef.slice(0,40) : null, 1.0, 'text', 'maxlength="40"', 'REQ-XXXXX (max 40 chars)')}
          </div>
        </div>
      </div>

      <!-- Submitted banner ───────────────────────────── -->
      ${poNum ? `
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px">
        <span style="font-size:20px;line-height:1">✓</span>
        <div>
          <div style="font-size:11px;color:#166534;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Submitted</div>
          <div style="font-size:17px;font-weight:700;font-family:monospace;color:#166534">${esc(poNum)}</div>
          ${d.po?.total_chf != null ? `<div style="font-size:12px;color:#4b7c58">CHF ${chf(d.po.total_chf)} (approval)</div>` : ''}
        </div>
      </div>` : ''}

    </div>
  `);
}

function llmCard(calls) {
  if (!calls || !calls.length) return '';
  return card('LLM calls', `<table class="data-table"><thead><tr><th>Attempt</th><th>Model</th><th>Prompt</th><th class="num">Tokens in</th><th class="num">Tokens out</th><th class="num">Cost CHF</th><th class="num">Latency</th><th>OK</th></tr></thead><tbody>
    ${calls.map(c=>`<tr><td>${c.attempt}</td><td class="mono">${esc(c.model)}</td><td class="mono">${esc(c.prompt_version)}</td><td class="num">${c.tokens_in?.toLocaleString()??'n/a'}</td><td class="num">${c.tokens_out?.toLocaleString()??'n/a'}</td><td class="num">${c.cost_chf!=null?c.cost_chf.toFixed(4):'n/a'}</td><td class="num">${c.latency_ms!=null?(c.latency_ms/1000).toFixed(1)+'s':'n/a'}</td><td>${c.success?'✓':'✗'}</td></tr>`).join('')}
  </tbody></table>`);
}


// ── Add-email dialog ──────────────────────────────────────────────────────────
const STEPS = ['received','ingest','extract','resolve','decide','submit'];
const STEP_LABELS = { received:'Received', ingest:'Ingest', extract:'LLM extract', resolve:'Resolve', decide:'Decide', submit:'Submit PO' };
let loadedRaw = null;

function openAddDialog() {
  loadedRaw = null;
  $('#eml').value = ''; $('#eml').readOnly = false;
  $('#badge').style.display = 'none';
  $('#try-msg').innerHTML = '';
  const stepper = $('#stepper');
  stepper.style.display = 'none';
  stepper.innerHTML = STEPS.map(s=>`<div class="step" data-step="${s}"><span class="num"></span>${STEP_LABELS[s]}</div>`).join('');
  $('#modal').classList.add('open');
}
function closeAddDialog() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeAddDialog(); });

(function wireDialog() {
  const drop = $('#drop'), ta = $('#eml'), file = $('#file'), badge = $('#badge');
  drop.addEventListener('click', () => file.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
  file.addEventListener('change', () => { if (file.files[0]) readFile(file.files[0]); });
  function readFile(f) {
    const reader = new FileReader();
    reader.onload = e => {
      loadedRaw = e.target.result;
      ta.value = loadedRaw.replace(/(?<=Content-Transfer-Encoding: base64\r?\n\r?\n)[\s\S]*?(?=\r?\n--)/g, '[binary attachment — sent to model]\n').slice(0, 1500);
      ta.readOnly = true;
      badge.textContent = `📎 ${f.name} (${(f.size/1024).toFixed(1)} KB)`;
      badge.style.display = 'block';
    };
    reader.readAsText(f);
  }
  $('#go').addEventListener('click', runProcess);
})();

async function runProcess() {
  const raw = loadedRaw ?? $('#eml').value.trim();
  if (!raw) { alert('Paste or drop an .eml first.'); return; }
  const go = $('#go'), sp = $('#go-sp'), tx = $('#go-tx'), stepper = $('#stepper'), msg = $('#try-msg');
  go.disabled = true; sp.style.display = 'inline-block'; tx.textContent = 'Processing…';
  stepper.style.display = 'flex'; msg.innerHTML = '';
  stepper.querySelectorAll('.step').forEach(s => s.className = 'step');

  const reached = [];
  try {
    await streamNdjson('/api/process', { method:'POST', body: raw }, obj => {
      if (obj.type === 'stage') {
        reached.push(obj.stage);
        stepper.querySelectorAll('.step').forEach(el => {
          const s = el.dataset.step;
          el.classList.remove('active','done');
          if (reached.includes(s)) el.classList.add(s === obj.stage ? 'active' : 'done');
        });
      } else if (obj.type === 'done') {
        stepper.querySelectorAll('.step').forEach(el => el.classList.add('done'));
        if (obj.id) {
          msg.innerHTML = `<div class="banner good">Processed → ${esc(obj.status)}. Opening…</div>`;
          justAddedId = obj.id;
          setTimeout(() => { closeAddDialog(); if (parseHash().name === 'detail') router(); else location.hash = '#/detail/' + obj.id; }, 650);
        } else {
          msg.innerHTML = `<div class="banner bad">Finished with status ${esc(obj.status)} — ${esc(obj.result?.error || 'no requisition stored')}.</div>`;
        }
      } else if (obj.type === 'error') {
        msg.innerHTML = `<div class="banner bad">Error: ${esc(obj.error)}</div>`;
      }
    });
  } catch (err) {
    msg.innerHTML = `<div class="banner bad">Network error: ${esc(err.message)}</div>`;
  } finally {
    go.disabled = false; sp.style.display = 'none'; tx.textContent = 'Process';
  }
}

// ── boot ──────────────────────────────────────────────────────────────────────
refreshState();
router();
</script>
