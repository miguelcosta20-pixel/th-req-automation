<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO Automation — Toastwerk</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; background: #f3f4f6; color: #111827; min-height: 100vh; }

/* ── Header ───────────────────────────────────────────────────── */
header { background: #1e293b; color: #f1f5f9; padding: 0 24px; display: flex; align-items: center; gap: 20px; height: 52px; }
header .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
header .state { margin-left: auto; font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.up { background: #22c55e; } .dot.down { background: #ef4444; }

main { padding: 24px; max-width: 1400px; margin: 0 auto; }
.page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.page-sub   { font-size: 13px; color: #6b7280; margin-bottom: 18px; }

/* ── Cards ──────────────────────────────────────────────────────── */
.card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 20px; }
.card-header { padding: 11px 18px; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; border-left: 3px solid #6366f1; background: #f8fafc; color: #1e293b; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 18px; }

/* ── Buttons ────────────────────────────────────────────────────── */
button { background: #4f46e5; color: #fff; border: none; border-radius: 6px; padding: 9px 18px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
button:hover { background: #4338ca; }
button:disabled { background: #a5b4fc; cursor: not-allowed; }
button.ghost { background: #fff; color: #4f46e5; border: 1px solid #c7d2fe; }
button.ghost:hover { background: #eef2ff; }
select { border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 10px; font-size: 13px; background: #fff; color: #111827; cursor: pointer; }
.spinner { width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Tables ─────────────────────────────────────────────────────── */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; padding: 9px 12px; background: #f9fafb; border-bottom: 2px solid #e5e7eb; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
.data-table tbody tr.clickable { cursor: pointer; }
.data-table tbody tr.clickable:hover { background: #eef2ff; }
.data-table tbody tr.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: #ddd6fe; } to { background: transparent; } }
.data-table .num { text-align: right; font-family: 'Menlo','Consolas',monospace; }
.data-table .mono { font-family: 'Menlo','Consolas',monospace; font-size: 12px; }

/* ── Status badge ───────────────────────────────────────────────── */
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-weight: 700; font-size: 12px; letter-spacing: .02em; white-space: nowrap; }
.status-submitted           { background: #dcfce7; color: #166534; }
.status-ready               { background: #dcfce7; color: #166534; }
.status-needs_clarification { background: #ffedd5; color: #9a3412; }
.status-needs_human_review  { background: #ffedd5; color: #9a3412; }
.status-security            { background: #fee2e2; color: #991b1b; }
.status-failed              { background: #f3f4f6; color: #4b5563; }
.status-duplicate           { background: #ede9fe; color: #5b21b6; }
.status-processing          { background: #e0f2fe; color: #075985; }
.status-waiting_approval    { background: #fef9c3; color: #92400e; }
.status-ready_to_submit     { background: #dcfce7; color: #166534; }
.status-rejected            { background: #fee2e2; color: #991b1b; }
.status-approved            { background: #dcfce7; color: #166534; }

/* ── Chips ──────────────────────────────────────────────────────── */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.chip-green { background: #dcfce7; color: #166534; }
.chip-amber { background: #fef9c3; color: #92400e; }
.chip-red   { background: #fee2e2; color: #991b1b; }
.chip-gray  { background: #f3f4f6; color: #4b5563; }
.chip-purple{ background: #ede9fe; color: #5b21b6; }

/* ── Queue: count pills, approver chips, controls ───────────────── */
.count-pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
.count-pill { cursor: pointer; border: 1px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 7px 13px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #334155; }
.count-pill:hover { border-color: #c7d2fe; }
.count-pill.active { border-color: #6366f1; background: #eef2ff; }
.count-pill .n { font-weight: 700; font-size: 15px; }
.count-pill .cdot { width: 8px; height: 8px; border-radius: 50%; }
.q-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input.search { border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 10px; font-size: 13px; min-width: 200px; outline: none; }
input.search:focus { border-color: #6366f1; }
.appr { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
.appr-pending  { background: #f3f4f6; color: #4b5563; }
.appr-approved { background: #dcfce7; color: #166534; }
.appr-rejected { background: #fee2e2; color: #991b1b; }
.appr-alt      { background: #fef9c3; color: #92400e; }
.appr-invalid  { background: #f3f4f6; color: #d1d5db; text-decoration: line-through; }
td.po-col { white-space: nowrap; min-width: 140px; }

/* ── Confidence bar ─────────────────────────────────────────────── */
.conf-wrap { display: flex; align-items: center; gap: 6px; }
.conf-bar-bg { height: 6px; width: 70px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
.conf-bar { height: 100%; border-radius: 4px; }
.conf-high { background: #22c55e; } .conf-medium { background: #eab308; } .conf-low { background: #ef4444; }
.conf-val { font-size: 11px; color: #6b7280; min-width: 32px; }

/* ── Chain ──────────────────────────────────────────────────────── */
.chain-list { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chain-step { display: flex; flex-direction: column; align-items: center; }
.chain-step .role { font-size: 10px; color: #6b7280; margin-top: 2px; }
.chain-arrow { color: #9ca3af; font-size: 15px; }

/* ── Field tables ───────────────────────────────────────────────── */
.kv { width: 100%; border-collapse: collapse; }
.kv td { padding: 6px 0; border-bottom: 1px solid #f6f7f9; font-size: 13px; vertical-align: top; }
.kv tr:last-child td { border-bottom: none; }
.kv td:first-child { color: #6b7280; width: 140px; }
.kv td:nth-child(2) { font-family: 'Menlo','Consolas',monospace; font-size: 12px; }

/* ── Detail layout ──────────────────────────────────────────────── */
.detail-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 20px; align-items: start; }
.detail-left { position: sticky; top: 24px; align-self: start; }
@media (max-width: 980px) {
  .detail-grid { grid-template-columns: 1fr; }
  .detail-left { position: static; }
}
.email-body { white-space: pre-wrap; font-family: 'Menlo','Consolas',monospace; font-size: 12px; color: #374151; background: #f8f9fb; border: 1px solid #eef0f3; border-radius: 6px; padding: 12px; max-height: 340px; overflow: auto; }
.email-meta { font-size: 12px; color: #6b7280; margin-bottom: 10px; }
.email-meta strong { color: #111827; }
embed.pdf { width: 100%; height: 420px; border: 1px solid #e5e7eb; border-radius: 6px; margin-top: 10px; }
mark.flagged { background: #fecaca; color: #7f1d1d; padding: 0 2px; border-radius: 2px; }

/* ── Summary card ───────────────────────────────────────────────── */
.summary { border-left: 4px solid #6366f1; }
.summary.sev-submitted, .summary.sev-duplicate { border-left-color: #22c55e; }
.summary.sev-needs_clarification { border-left-color: #f97316; }
.summary.sev-needs_human_review { border-left-color: #f97316; }
.summary.sev-security, .summary.sev-failed { border-left-color: #ef4444; }
.summary-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
@media (max-width: 780px) { .summary-grid { grid-template-columns: 1fr; } }
.summary h3 { font-size: 15px; font-weight: 700; margin: 8px 0 4px; }
.summary .reason { font-size: 13px; color: #4b5563; line-height: 1.5; }
.summary .action { margin-top: 12px; font-size: 13px; }
.summary .action b { color: #4338ca; }
.summary .total { font-size: 26px; font-weight: 700; font-family: 'Menlo','Consolas',monospace; }
.summary .total-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; }
.sec-box { margin-top: 12px; padding: 10px 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; font-size: 12px; color: #991b1b; }
.pending { font-size: 9px; background: #fef3c7; color: #92400e; padding: 1px 5px; border-radius: 8px; margin-top: 3px; }

.action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.action-btns button { font-size: 12px; padding: 8px 14px; }
.btn-approve { background: #16a34a; } .btn-approve:hover { background: #15803d; }
.btn-reject { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; } .btn-reject:hover { background: #fef2f2; }
#action-note { margin-top: 10px; font-size: 12px; }

/* ── Detail header (simple CTA bar for actionable states) ────────── */
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 14px 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.detail-header-meta { flex: 1 1 200px; }
.detail-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.detail-header-total { text-align: right; }
.detail-header-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
/* Force consistent height across ghost + primary buttons in the action row */
.detail-header-actions > button { height: 36px; padding: 0 16px; }
.btn-submit-appr { background: #6366f1; color: #fff; border: none; border-radius: 5px; font-size: 13px; cursor: pointer; font-family: inherit; }
.btn-submit-appr:hover:not(:disabled) { background: #4f46e5; }
.btn-submit-appr:disabled { opacity: 0.4; cursor: not-allowed; }
/* Tooltip on disabled submit button — shown via wrapper span */
#submit-btn-wrap { position: relative; display: inline-block; }
#submit-btn-wrap[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); right: 0;
  background: #1f2937; color: #f9fafb; font-size: 11px; white-space: nowrap;
  padding: 5px 9px; border-radius: 4px; pointer-events: none; z-index: 50;
}
#submit-btn-wrap[data-tip]:hover::before {
  content: ''; position: absolute; bottom: calc(100% + 1px); right: 14px;
  border: 5px solid transparent; border-top-color: #1f2937; pointer-events: none; z-index: 50;
}

/* ── Collapsible sections ───────────────────────────────────────── */
details.sec { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; }
details.sec > summary { padding: 11px 18px; cursor: pointer; list-style: none; border-left: 3px solid #6366f1; background: #f8fafc; display: flex; align-items: center; gap: 10px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .sec-title { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #1e293b; }
details.sec > summary .sec-oneline { font-size: 12px; color: #6b7280; font-family: 'Menlo','Consolas',monospace; margin-left: auto; }
details.sec > summary .caret { color: #9ca3af; transition: transform .15s; }
details.sec[open] > summary .caret { transform: rotate(90deg); }
details.sec[open] > summary .sec-oneline { display: none; }
details.sec .sec-content { padding: 18px; }

/* ── AI chips ───────────────────────────────────────────────────── */
.ai-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: default; border: 1px solid transparent; max-width: 100%; overflow: hidden; flex-shrink: 0; }
.ai-chip-plain  { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.ai-chip-warn   { background: #fef9c3; color: #92400e; border-color: #fde68a; }
.ai-chip-alert  { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
/* Double-sparkle icon: two ✦ glyphs, bigger top-left + smaller bottom-right */
.ai-spark { position: relative; display: inline-block; width: 14px; height: 11px; flex-shrink: 0; vertical-align: -1px; }
.sp-big { position: absolute; top: 0; left: 0; font-size: 10px; line-height: 1; }
.sp-sm  { position: absolute; bottom: 0; right: 0; font-size: 6px; line-height: 1; opacity: 0.75; }
.ai-chip .chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-conf { display: none; } /* confidence is now shown via title tooltip only */
/* ⚠ icon at chip end — visible on warn chips to prompt hover */
.ai-warn-icon { font-size: 9px; flex-shrink: 0; margin-left: 1px; opacity: 0.85; }
.ai-chip-remove { background: none; border: none; cursor: pointer; color: inherit; opacity: 0.5; font-size: 14px; padding: 0 0 0 3px; line-height: 1; flex-shrink: 0; }
.ai-chip-remove:hover { opacity: 1; background: none; }

/* ── Field box: input that visually contains an AI chip ─────────── */
/* Looks like a normal input. When AI value present, shows chip; plain text input otherwise. */
.field-box { display: flex; align-items: center; flex-wrap: nowrap; gap: 4px; padding: 4px 8px; min-height: 32px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff; cursor: text; box-sizing: border-box; width: 100%; overflow: hidden; }
.field-box:focus-within { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.15); }
.field-box input { border: none; outline: none; flex: 1; min-width: 40px; width: 0; font-size: 13px; color: #111827; background: transparent; font-family: inherit; padding: 0; }
/* Compact variant for table cells */
.li-td .field-box { min-height: 26px; padding: 2px 5px; }
.li-td .field-box input { font-size: 12px; }
.li-td .field-box .ai-chip { font-size: 11px; padding: 1px 6px; }

/* ── PO Form ────────────────────────────────────────────────────── */
.po-form { display: flex; flex-direction: column; gap: 0; }
.po-group { margin-bottom: 24px; }
.po-group-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; padding: 0 0 7px; margin-bottom: 8px; border-bottom: 1px solid #e5e7eb; }
.po-row { display: grid; padding: 10px 0; border-bottom: 1px solid #f3f4f6; gap: 12px; }
.po-row:last-child { border-bottom: none; }
.po-row-2 { grid-template-columns: 1fr 1fr; }
.po-row-1 { grid-template-columns: 1fr; }
.po-label { font-size: 12px; color: #6b7280; font-weight: 500; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.po-label .req { color: #ef4444; font-weight: 700; }
.po-label .opt { font-size: 10px; color: #9ca3af; font-weight: 400; }
.po-input { width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 5px; font-family: inherit; color: #111827; background: #fff; box-sizing: border-box; }
.po-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.15); }
.po-total-display { font-size: 15px; font-weight: 700; font-family: monospace; padding: 5px 0; color: #111827; }
@media (max-width: 700px) { .po-row-2 { grid-template-columns: 1fr; } }

/* ── Line items table ───────────────────────────────────────────── */
.li-table { width: 100%; border-collapse: collapse; }
.li-table th { font-size: 11px; font-weight: 600; color: #6b7280; padding: 5px 6px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap; }
.li-table th:nth-child(n+4) { text-align: right; }
.li-td { padding: 4px 6px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
.li-table tfoot td { font-size: 12px; padding: 7px 6px; border-top: 2px solid #e5e7eb; }
.li-tfoot-label { text-align: right; color: #6b7280; font-weight: 600; }
.li-tfoot-total { text-align: right; font-family: monospace; font-weight: 700; color: #111827; white-space: nowrap; }
.li-total-cell { text-align: right; font-family: monospace; font-size: 12px; white-space: nowrap; color: #374151; }
.li-remove { background: none; border: none; cursor: pointer; color: #d1d5db; font-size: 16px; padding: 0 2px; line-height: 1; display: block; }
.li-remove:hover { color: #ef4444; background: none; }

/* ── Match check row ────────────────────────────────────────────── */
.check-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; }
.check-row.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.check-row.bad { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

/* ── Reasons & draft ────────────────────────────────────────────── */
.reason-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.reason-item { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; padding: 6px 10px; border-radius: 6px; background: #f9fafb; border: 1px solid #f0f0f0; }
.reason-item.warn  { background: #fef9c3; border-color: #fde68a; color: #92400e; }
.reason-item.alert { background: #fee2e2; border-color: #fecaca; color: #991b1b; }

/* ── Approval chain in PO form ──────────────────────────────────── */
.appr-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #f3f4f6; }
.appr-row:last-child { border-bottom: none; }
.appr-row.approved { background: #f0fdf4; }
.appr-row.rejected { background: #fef2f2; }
.appr-btn { border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
.appr-btn:hover:not(:disabled) { filter: brightness(0.92); }
.appr-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.appr-btn-ok  { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
.appr-btn-rej { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
.appr-status { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
.appr-status.waiting  { background: #fef9c3; border: 1px solid #fde68a; color: #92400e; }
.appr-status.ready    { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.appr-status.rejected { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; }
.reason-code { font-family: monospace; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.draft-reply { font-family: 'Menlo','Consolas',monospace; font-size: 11px; background: #f8f9fb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; color: #374151; }

/* ── Line items ─────────────────────────────────────────────────── */
.items-table { width: 100%; border-collapse: collapse; }
.items-table th { text-align: left; font-size: 11px; font-weight: 600; color: #6b7280; padding: 6px 8px; background: #f9fafb; border-bottom: 2px solid #e5e7eb; }
.items-table th:nth-child(n+2) { text-align: right; }
.items-table td { padding: 7px 8px; font-size: 12.5px; border-bottom: 1px solid #f3f4f6; }
.items-table td:nth-child(n+2) { text-align: right; font-family: monospace; }
.items-table tr.total-row td { font-weight: 700; border-top: 2px solid #e5e7eb; background: #f9fafb; }

/* ── Add-email dialog ───────────────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: flex-start; justify-content: center; padding: 56px 20px; z-index: 50; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 10px; width: 100%; max-width: 580px; box-shadow: 0 20px 50px rgba(0,0,0,.3); max-height: 86vh; overflow: auto; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #eef0f3; position: sticky; top: 0; background: #fff; }
.modal-head h2 { font-size: 15px; font-weight: 700; }
.modal-head button.close { background: none; color: #6b7280; font-size: 22px; padding: 0; width: 30px; height: 30px; }
.modal-head button.close:hover { background: #f3f4f6; }
.modal-body { padding: 20px; }

.drop-zone { border: 2px dashed #d1d5db; border-radius: 8px; padding: 26px 16px; text-align: center; color: #6b7280; cursor: pointer; transition: border-color .15s, background .15s; }
.drop-zone:hover, .drop-zone.drag-over { border-color: #6366f1; background: #eef2ff; color: #4f46e5; }
textarea { width: 100%; min-height: 140px; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-family: 'Menlo','Consolas',monospace; font-size: 11px; color: #374151; resize: vertical; outline: none; margin-top: 12px; }
textarea:focus { border-color: #6366f1; }
.stepper { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.step { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #9ca3af; padding: 6px 12px; border-radius: 20px; background: #f3f4f6; border: 1px solid #e5e7eb; }
.step .num { width: 18px; height: 18px; border-radius: 50%; background: #d1d5db; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.step.active { color: #4338ca; background: #eef2ff; border-color: #c7d2fe; }
.step.active .num { background: #6366f1; }
.step.done { color: #166534; background: #dcfce7; border-color: #bbf7d0; }
.step.done .num { background: #22c55e; }

.banner { padding: 12px 16px; border-radius: 8px; font-size: 13px; }
.banner.good { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
.banner.bad  { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
.empty { text-align: center; color: #9ca3af; padding: 48px 16px; }
a.back { font-size: 13px; color: #4f46e5; text-decoration: none; display: inline-block; margin-bottom: 14px; }
a.back:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect width="20" height="20" rx="4" fill="#6366f1"/><path d="M5 6h10M5 10h6M5 14h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>PO Automation</span>
  </div>
  <div class="state" id="state"></div>
</header>

<main id="view"></main>

<!-- Add-email dialog -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head"><h2>New requisition email</h2><button class="close" onclick="closeAddDialog()">×</button></div>
    <div class="modal-body">
      <div class="drop-zone" id="drop"><div>Drop an <strong>.eml</strong> file here</div><small style="color:#9ca3af">or paste raw email text below</small></div>
      <textarea id="eml" placeholder="Paste raw .eml content here…"></textarea>
      <div id="badge" style="display:none;margin-top:10px;font-size:12px;color:#4f46e5;background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:6px 10px"></div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="go"><span id="go-sp" class="spinner" style="display:none"></span><span id="go-tx">Process</span></button>
        <button class="ghost" onclick="closeAddDialog()">Cancel</button>
      </div>
      <div class="stepper" id="stepper" style="display:none"></div>
      <div id="try-msg" style="margin-top:14px"></div>
    </div>
  </div>
</div>

<!-- Confirmation modal -->
<div class="modal-overlay" id="confirm-modal" onclick="if(event.target===this)closeConfirmModal()">
  <div class="modal" style="max-width:420px">
    <div class="modal-head"><h2 id="confirm-title"></h2><button class="close" onclick="closeConfirmModal()">×</button></div>
    <div class="modal-body">
      <p id="confirm-message" style="font-size:14px;color:#374151;margin-bottom:20px;line-height:1.5"></p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="ghost" onclick="closeConfirmModal()">Cancel</button>
        <button style="background:#6366f1;color:#fff;border:none;border-radius:5px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit" onclick="confirmModalYes()">Submit anyway</button>
      </div>
    </div>
  </div>
</div>
<input type="file" id="file" accept=".eml" style="display:none">

<script>
// ── Utilities ─────────────────────────────────────────────────────────────────
const $ = sel => document.querySelector(sel);
const view = $('#view');

function esc(s) { if (s == null) return '—'; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function chf(n) { return n == null ? '—' : Number(n).toLocaleString('de-CH', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function cur(n, c) { return n == null ? '—' : `${c ?? ''} ${chf(n)}`.trim(); }
function statusBadge(s) {
  // Backward compat: existing DB rows may still have 'submitted' — display as Approved.
  const display = s === 'submitted' ? 'approved' : s;
  const LABEL = {
    needs_clarification: 'Needs Review',
    needs_human_review: 'Needs Review',
    security: 'Security Risk',
    failed: 'Failed', duplicate: 'Duplicate', processing: 'Processing',
    waiting_approval: 'Waiting for Approval',
    rejected: 'Rejected',
    approved: 'Approved',
  };
  const ICON = { needs_clarification:'⚑', needs_human_review:'⚑', security:'⛔', failed:'✗', duplicate:'⊙', processing:'…', waiting_approval:'⏳', rejected:'✗', approved:'✓' };
  return `<span class="status-badge status-${esc(display)}">${ICON[display] ?? '?'} ${esc(LABEL[display] ?? String(display).replace(/_/g,' '))}</span>`;
}
function confBar(c) {
  if (c == null) return '—';
  const pct = Math.round(c*100);
  const cls = c >= 0.8 ? 'conf-high' : c >= 0.5 ? 'conf-medium' : 'conf-low';
  return `<div class="conf-wrap"><div class="conf-bar-bg"><div class="conf-bar ${cls}" style="width:${pct}%"></div></div><span class="conf-val">${pct}%</span></div>`;
}
async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}
// Reads an NDJSON stream (one JSON object per line), calling onObj for each.
async function streamNdjson(url, opts, onObj) {
  const res = await fetch(url, opts);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (line) onObj(JSON.parse(line));
    }
  }
  if (buf.trim()) onObj(JSON.parse(buf.trim()));
}
function card(title, bodyHtml) { return `<div class="card"><div class="card-header">${esc(title)}</div><div class="card-body">${bodyHtml}</div></div>`; }

// ── Router (queue + detail only) ───────────────────────────────────────────────
const routes = { queue: renderQueue, detail: renderDetail };
function parseHash() {
  const parts = (location.hash.replace(/^#\//, '') || 'queue').split('/');
  return { name: parts[0], arg: parts[1] };
}
async function router() {
  const { name, arg } = parseHash();
  const fn = routes[name] ?? renderQueue;
  view.innerHTML = '<div class="empty">Loading…</div>';
  try { await fn(arg); }
  catch (err) { view.innerHTML = `<div class="banner bad">Error: ${esc(err.message)}</div>`; }
}
window.addEventListener('hashchange', router);

async function refreshState() {
  try {
    const s = await fetchJson('/api/state');
    window._fxRates = s.fxRates || { CHF: 1.0, EUR: 0.96, USD: 0.88, GBP: 1.13 };
    $('#state').innerHTML = `<span>${esc(s.customer)}</span> · <span class="dot ${s.mockApi?'up':'down'}"></span> PO API ${s.mockApi?'online':'offline'}`;
  } catch {
    window._fxRates = window._fxRates || { CHF: 1.0, EUR: 0.96, USD: 0.88, GBP: 1.13 };
    $('#state').innerHTML = '';
  }
}

// ── Queue ───────────────────────────────────────────────────────────────────────
let justAddedId = null;   // highlights the row for a freshly processed email
const qState = { status: '', search: '', sort: 'priority' };

// Default sort order: most-urgent statuses first.
const STATUS_PRIORITY = { security: 0, needs_human_review: 1, needs_clarification: 1, waiting_approval: 2, rejected: 3, approved: 4, duplicate: 5, failed: 6, processing: 7 };
const STATUS_DOT = { security: '#ef4444', needs_human_review: '#f97316', needs_clarification: '#f97316', submitted: '#22c55e', approved: '#22c55e', rejected: '#ef4444', waiting_approval: '#eab308', duplicate: '#8b5cf6', failed: '#9ca3af', processing: '#38bdf8' };
const PILL_ORDER = ['security', 'needs_human_review', 'waiting_approval', 'rejected', 'approved', 'duplicate', 'failed'];
const PILL_LABEL = { security: 'security risk', needs_human_review: 'needs review', needs_clarification: 'needs review', submitted: 'approved', duplicate: 'duplicate', failed: 'failed', approved: 'approved', rejected: 'rejected', waiting_approval: 'waiting for approval' };

async function renderQueue() {
  const rows = await fetchJson('/api/queue');
  window._queue = rows;
  const counts = {}; rows.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
  // Merge needs_clarification into the single "needs review" pill so we don't show two identical pills.
  counts['needs_human_review'] = (counts['needs_human_review'] || 0) + (counts['needs_clarification'] || 0);
  const pills = PILL_ORDER.filter(s => counts[s]).map(s =>
    `<div class="count-pill" data-status="${s}"><span class="cdot" style="background:${STATUS_DOT[s]}"></span>${PILL_LABEL[s]} <span class="n">${counts[s]}</span></div>`).join('');

  view.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div><div class="page-title">Queue</div><div class="page-sub" id="q-sub"></div></div>
      <div class="q-controls">
        <input class="search" id="q-search" placeholder="Search requester or supplier…" value="${esc(qState.search)}">
        <select id="q-sort">
          <option value="priority">Sort: priority</option>
          <option value="newest">Sort: newest first</option>
        </select>
        <button class="ghost" onclick="renderQueue()">↻ Refresh</button>
        <button onclick="openAddDialog()">+ New email</button>
      </div>
    </div>
    <div class="count-pills" id="q-pills"><div class="count-pill" data-status=""><span class="cdot" style="background:#64748b"></span>all <span class="n">${rows.length}</span></div>${pills}</div>
    ${rows.length === 0
      ? `<div class="card"><div class="empty">No requisitions yet.<br><button style="margin-top:12px" onclick="openAddDialog()">+ Add the first one</button></div></div>`
      : `<div class="card"><table class="data-table"><thead><tr>
          <th>ID</th><th>Received</th><th>Requester</th><th>Supplier</th><th class="num">CHF total</th><th>Approval chain</th><th>Status</th><th>Reason</th><th>Min conf.</th><th>PO</th>
        </tr></thead><tbody id="qbody"></tbody></table></div>`}
  `;

  $('#q-sort').value = qState.sort;
  $('#q-sort').addEventListener('change', e => { qState.sort = e.target.value; applyRows(); });
  $('#q-search').addEventListener('input', e => { qState.search = e.target.value; applyRows(); });
  document.querySelectorAll('#q-pills .count-pill').forEach(p => p.addEventListener('click', () => {
    const s = p.dataset.status;
    qState.status = (qState.status === s) ? '' : s;   // toggle off if already active
    applyRows();
  }));

  applyRows();
  if (justAddedId) {
    const el = $('#qrow-' + justAddedId);
    if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    justAddedId = null;
  }
}

function applyRows() {
  const rows = window._queue || [];
  const q = qState.search.trim().toLowerCase();
  let filtered = rows.filter(r =>
    (!qState.status ||
      r.status === qState.status ||
      // "needs review" pill covers both review statuses
      (qState.status === 'needs_human_review' && r.status === 'needs_clarification')) &&
    (!q || (r.requester || '').toLowerCase().includes(q) || (r.supplier || '').toLowerCase().includes(q)));

  const recv = r => new Date(r.receivedAt || r.createdAt || 0).getTime();
  filtered.sort((a, b) => qState.sort === 'newest'
    ? recv(b) - recv(a) || b.id - a.id
    : (STATUS_PRIORITY[a.status] ?? 9) - (STATUS_PRIORITY[b.status] ?? 9) || recv(b) - recv(a) || b.id - a.id);

  const body = $('#qbody');
  if (body) body.innerHTML = filtered.map(queueRowHtml).join('')
    || `<tr><td colspan="10" class="empty" style="padding:28px">No requisitions match.</td></tr>`;
  const sub = $('#q-sub');
  if (sub) sub.textContent = `${filtered.length} of ${rows.length} shown${qState.status ? ' · ' + PILL_LABEL[qState.status] : ''}`;
  document.querySelectorAll('#q-pills .count-pill').forEach(p =>
    p.classList.toggle('active', p.dataset.status === qState.status));
}

function queueTotal(r) {
  if (r.extractionFailed || r.totalChf == null) return '<span style="color:#9ca3af">n/a</span>';
  const sub = (r.currency && r.currency !== 'CHF' && r.statedTotal != null)
    ? `<div style="font-size:11px;color:#9ca3af">${esc(r.currency)} ${chf(r.statedTotal)}</div>` : '';
  return `<div>CHF ${chf(r.totalChf)}</div>${sub}`;
}
function queueChain(r) {
  // Hide approval chain for statuses before the clerk submits for approval
  if (['needs_human_review','needs_clarification','security'].includes(r.status)) return '<span style="color:#9ca3af">—</span>';
  const steps = r.chain;
  if (!steps || !steps.length) return '<span style="color:#9ca3af">—</span>';
  return `<div class="chain-list">${steps.map((s,i) => {
    const cls = s.status === 'approved' ? 'appr-approved' : s.status === 'rejected' ? 'appr-rejected' : (s.requiresAlternate ? 'appr-alt' : 'appr-pending');
    const tip = `${(s.role||'').replace(/_/g,' ')} — ${s.status || 'pending'}${s.requiresAlternate ? ' (alternate required)' : ''}`;
    return `${i>0?'<span class="chain-arrow">→</span>':''}<span class="appr ${cls}" title="${esc(tip)}">${esc(s.name)}${s.requiresAlternate?' ⚠':''}</span>`;
  }).join('')}</div>`;
}
function queueRowHtml(r) {
  const conf = (r.extractionFailed || r.minConfidence == null) ? '<span style="color:#9ca3af">n/a</span>' : confBar(r.minConfidence);
  return `<tr id="qrow-${r.id}" class="clickable" onclick="location.hash='#/detail/${r.id}'">
    <td class="mono">#${r.id}</td>
    <td style="white-space:nowrap">${r.receivedAt ? fmtDate(r.receivedAt) : 'n/a'}</td>
    <td>${esc(r.requester)}</td>
    <td>${r.supplier ? esc(r.supplier) : '<span class="chip chip-gray">unresolved</span>'}</td>
    <td class="num">${queueTotal(r)}</td>
    <td>${queueChain(r)}</td>
    <td>${statusBadge(r.status)}</td>
    <td style="font-size:12px;color:#4b5563">${r.reason ? esc(r.reason) : '<span style="color:#9ca3af">—</span>'}</td>
    <td>${conf}</td>
    <td class="po-col mono">${r.poNumber ? esc(r.poNumber) : '—'}</td>
  </tr>`;
}

// ── Detail ──────────────────────────────────────────────────────────────────────
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDateTime(s) {
  if (!s) return 'n/a';
  const d = new Date(s); if (isNaN(d.getTime())) return esc(s);
  const hh = String(d.getUTCHours()).padStart(2,'0'), mm = String(d.getUTCMinutes()).padStart(2,'0');
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}, ${hh}:${mm} UTC`;
}
function fmtDate(s) {
  if (!s) return 'n/a';
  const d = new Date(s); if (isNaN(d.getTime())) return esc(s);
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
// Collapsible section with a one-line summary shown when collapsed.
function sec(title, oneline, content) {
  return `<details class="sec" open><summary><span class="caret">▸</span><span class="sec-title">${esc(title)}</span><span class="sec-oneline">${oneline}</span></summary><div class="sec-content">${content}</div></details>`;
}

async function renderDetail(id) {
  const d = await fetchJson('/api/requisition/' + id);
  window._detail = d;
  _detailStatus = null;    // always start from DB status
  _approvalStates = (d.approvalState?.states)   ?? {};
  _alternateApprovers = (d.approvalState?.alternates) ?? {};
  _showAlternateForm = new Set();
  _poSubmitted = false;
  _clerkFormValues = null;
  _submitError = null;
  renderDetailView(d);
}

// ── Summary card ────────────────────────────────────────────────────────────────
function statusHeadline(s) {
  return ({
    approved:            'Approved — purchase order raised',
    submitted:           'Approved — purchase order raised',  // backward compat
    duplicate:           'Duplicate — existing PO reused',
    needs_clarification: 'Needs review',
    needs_human_review:  'Needs review',
    security:            'Security risk — blocked for review',
    failed:              'Processing failed',
    processing:          'Processing',
  })[s] ?? s;
}
// Plain-language explanation of the status, drawing on the stored review reasons.
function plainReason(d) {
  const details = (d.reviewItems || []).map(r => r.detail).filter(Boolean);
  switch (d.status) {
    case 'approved':
    case 'submitted':   return { reason: 'All approvers have approved the requisition and a purchase order has been raised.', action: 'No further action needed — see the PO number below.' };
    case 'duplicate':  return { reason: 'This email was processed before; the existing purchase order was reused rather than creating a second one.', action: 'No action needed — see the existing PO.' };
    case 'needs_clarification': return { reason: 'Required information is missing or unclear, so the requisition was held rather than guessed.' + (details.length ? ' Missing: ' + esc(details.join('; ')) + '.' : ''), action: 'Send the drafted reply to the requester.' };
    case 'needs_human_review':  return { reason: 'A rule needs a person to decide.' + (details.length ? ' Flags: ' + esc(details.join('; ')) + '.' : ''), action: 'Review the flags, then approve or reject.' };
    case 'security':   return { reason: 'The email contained an instruction aimed at the processor. Email content is untrusted, so it was quarantined and ignored; no purchase order was created.', action: 'Investigate the sender; do not process automatically.' };
    case 'failed':     return { reason: 'Processing could not complete' + (d.error ? ': ' + esc(d.error) : '.'), action: 'Inspect the error and retry.' };
    default:           return { reason: '', action: '' };
  }
}
function summaryChain(chain, chainResult) {
  if (!chain || !chain.length) {
    const reason = chainResult && chainResult.ok === false ? chainResult.reason : 'No approval chain';
    return `<span class="chip chip-gray">${esc(reason)}</span>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:8px">${chain.map((s,i) =>
    `<div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#9ca3af;width:14px">${i+1}</span><div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(s.name)}</div><div style="font-size:11px;color:#6b7280">${esc((s.role||'').replace(/_/g,' '))}</div></div><span class="pending">pending</span></div>`
  ).join('')}</div>`;
}
function summaryCard(d) {
  const sol = d.resolution, ext = d.extraction;
  const pr = plainReason(d);
  const chain = sol?.chain?.ok ? sol.chain.chain : null;
  const total = sol?.computedTotalChf;
  const quarantined = d.status === 'security'
    ? (ext?.instructions_to_reader || (d.reviewItems || []).find(r => r.queue === 'security')?.detail)
    : null;
  return `<div class="card summary sev-${esc(d.status)}"><div class="card-body"><div class="summary-grid">
    <div>
      ${statusBadge(d.status)}
      <h3>${esc(statusHeadline(d.status))}</h3>
      <div class="reason">${pr.reason}</div>
      ${quarantined ? `<div class="sec-box"><strong>⛔ Blocked:</strong> the message tried to instruct the processor — “${esc(quarantined)}”. This text was quarantined and never acted on.</div>` : ''}
      <div class="action">Recommended: <b>${esc(pr.action)}</b></div>
      <div class="action-btns">
        <button class="btn-approve" onclick="doAction('approve')">Send for approval</button>
        <button onclick="doAction('clarify')">Request clarification</button>
        <button class="btn-reject" onclick="doAction('reject')">Reject</button>
      </div>
      <div id="action-note"></div>
    </div>
    <div>
      <div class="total-label">CHF total</div>
      <div class="total">${total != null ? 'CHF ' + chf(total) : 'n/a'}</div>
      <div class="total-label" style="margin-top:16px">Approval chain · all pending</div>
      <div style="margin-top:8px">${summaryChain(chain, sol?.chain)}</div>
    </div>
  </div></div></div>`;
}
function doAction(kind) {
  const d = window._detail, note = $('#action-note');
  const chain = d.resolution?.chain?.ok ? d.resolution.chain.chain : [];
  if (kind === 'approve') {
    note.innerHTML = chain.length
      ? `<span class="chip chip-green">prototype</span> Would send for approval to ${chain.map(s => esc(s.name)).join(', ')}.`
      : `<span class="chip chip-amber">prototype</span> No approval chain resolved — cannot route for approval.`;
  } else if (kind === 'clarify') {
    const dc = $('#draft-card');
    if (dc) { dc.open = true; dc.scrollIntoView({ behavior: 'smooth', block: 'center' }); note.innerHTML = `<span class="chip chip-green">prototype</span> Opened the drafted reply — would email it to the requester.`; }
    else note.innerHTML = `<span class="chip chip-gray">prototype</span> No drafted reply exists for this status.`;
  } else if (kind === 'reject') {
    note.innerHTML = `<span class="chip chip-red">prototype</span> Would mark this requisition rejected (not persisted).`;
  }
}

function emailCard(d) {
  const e = d.email;
  const flagged = d.extraction?.instructions_to_reader?.trim();
  let bodyHtml = esc(e.textBody);
  let banner = '';
  if (flagged) {
    const needle = esc(flagged);
    if (bodyHtml.includes(needle)) bodyHtml = bodyHtml.replace(needle, `<mark class="flagged">${needle}</mark>`);
    banner = `<div class="sec-box" style="margin-bottom:10px"><strong>⚠ Flagged text (quarantined, not executed):</strong> ${needle}</div>`;
  }
  const atts = (e.attachments || []).map(a => {
    const link = `/api/requisition/${d.id}/attachment/${a.idx}`;
    return `<div style="margin-top:8px;font-size:12px">📎 <a href="${link}" target="_blank">${esc(a.filename)}</a> <span class="chip chip-gray">${(a.size/1024).toFixed(1)} KB</span>${a.isPdf ? `<embed class="pdf" src="${link}" type="application/pdf">` : ''}</div>`;
  }).join('');
  return card('Original email', `
    ${banner}
    <div class="email-meta"><strong>From:</strong> ${esc(e.from)}<br><strong>Subject:</strong> ${esc(e.subject)}<br><strong>Received:</strong> ${fmtDateTime(e.date)}</div>
    <div class="email-body">${bodyHtml}</div>
    ${atts || '<div style="font-size:12px;color:#9ca3af;margin-top:8px">No attachments.</div>'}
  `);
}
function draftCard(d) {
  if (!d.draftReply) return '';

function matchPill(r) { return r?.match ? `<span class="chip chip-gray">match ${Math.round((r.score ?? 0)*100)}%</span>` : ''; }
function masterDataCard(sol) {

  const oneline = `${sup?.match?'supplier ✓':'supplier ✗'} · ${cc?.match?'CC ✓':'CC ✗'} · ${emp?.match?'requester ✓':'requester ✗'}`;

function chfCard(sol, ext) {
  if (!sol) return '';
  const raw = rawTotalOf(ext);
  const c = sol.currency || 'CHF';
  const computed = sol.computedTotalChf;
  const priced = (ext?.line_items || []).some(i => i.quantity != null && i.unit_price != null);
  const expected = Math.round(raw * (sol.fxRate ?? 1) * 100) / 100;
  const matches = priced && Math.abs(expected - computed) < 0.01;
  const checkHtml = !priced
    ? `<div class="check-row">No priced line items — a stated total is n/a.</div>`
    : matches
      ? `<div class="check-row ok">✓ Computed CHF total matches the line items${c !== 'CHF' ? ` at FX ${sol.fxRate}` : ''}.</div>`
      : `<div class="check-row bad">✗ Mismatch: the line items imply CHF ${chf(expected)}, but the computed total is CHF ${chf(computed)}.</div>`;
  const fxRow = c !== 'CHF'
    ? `<tr><td>FX conversion</td><td>${esc(c)} ${chf(raw)} × ${sol.fxRate} → <strong>CHF ${chf(computed)}</strong></td></tr>`
    : `<tr><td>Computed total</td><td><strong>CHF ${chf(computed)}</strong></td></tr>`;
  const oneline = `${c !== 'CHF' ? esc(c)+' '+chf(raw)+' × '+sol.fxRate+' = ' : ''}CHF ${chf(computed)}${priced ? (matches ? ' ✓' : ' ✗') : ''}`;
  return sec('CHF calculation', oneline, `
    <table class="kv">
      <tr><td>Stated (line items)</td><td>${priced ? esc(c)+' '+chf(raw) : 'n/a'}</td></tr>
      ${fxRow}
    </table>
    ${checkHtml}`);
}
function approvalChainCard(sol) {

}

// ── PO Form helpers ───────────────────────────────────────────────────────────
// Each field is a .field-box that looks like a regular input. When an AI value
// exists, a coloured chip sits inside the box. Clicking × removes the chip and
// the <input> inside the same box becomes editable. The input always holds the
// current value so reads work the same regardless of chip state.

// Confidence threshold below which an AI chip turns yellow (warning).
// Mirrors the pipeline's autoConfidence threshold (0.80): if the pipeline
// would have auto-submitted the value, show a plain chip; if it wouldn't
// (confidence below 80%), the clerk should verify it — warn chip.
const CHIP_WARN_THRESHOLD = 80; // percent

function aiChip(fieldId, displayVal, rawVal, confidence, inputType = 'text', inputAttrs = '', placeholder = '', alertLevel = null) {
  const hasVal   = displayVal != null && displayVal !== '';
  const confPct  = confidence != null ? Math.round(confidence * 100) : null;
  // Color: security → red, explicit warning OR low confidence → yellow, otherwise neutral plain
  const chipClass = alertLevel === 'security' ? 'ai-chip-alert'
    : (alertLevel === 'warning' || (confPct != null && confPct < CHIP_WARN_THRESHOLD)) ? 'ai-chip-warn'
    : 'ai-chip-plain';
  // Tooltip text — shown via native title attribute; does NOT change chip content on hover
  const tipText  = confPct != null
    ? `extracted by AI with ${confPct}% confidence`
    : 'extracted by AI';
  // ⚠ visible at chip end on warn chips — prompts the user to hover and read tooltip
  const warnIcon = chipClass === 'ai-chip-warn'
    ? '<span class="ai-warn-icon">⚠</span>' : '';
  const sparkle  = '<span class="ai-spark" aria-hidden="true"><span class="sp-big">✦</span><span class="sp-sm">✦</span></span>';
  const safeRaw  = esc(String(rawVal ?? displayVal ?? ''));
  const ph       = placeholder ? ` placeholder="${esc(placeholder)}"` : '';
  const chipHtml = hasVal ? `<span class="ai-chip ${chipClass}" title="${tipText}">${sparkle}<span class="chip-text">${esc(String(displayVal))}</span>${warnIcon}<button class="ai-chip-remove" onclick="event.stopPropagation();removeAiChip('${fieldId}')" title="Remove and edit">×</button></span>` : '';
  return `<div class="field-box" id="fieldbox-${fieldId}" onclick="this.querySelector('input').focus()">${chipHtml}<input id="input-${fieldId}" type="${inputType}" value="${safeRaw}"${hasVal ? ' style="display:none"' : ''}${ph} ${inputAttrs}></div>`;
}

function aiDateChip(fieldId, dateVal, basisLabel, alertLevel = null, confidence = null) {
  const hasVal   = !!dateVal;
  const confPct  = confidence != null ? Math.round(confidence * 100) : null;
  const chipClass = alertLevel === 'security' ? 'ai-chip-alert'
    : (alertLevel === 'warning' || (confPct != null && confPct < CHIP_WARN_THRESHOLD)) ? 'ai-chip-warn'
    : 'ai-chip-plain';
  const tipText  = confPct != null ? `extracted by AI with ${confPct}% confidence` : 'extracted by AI';
  const warnIcon = chipClass === 'ai-chip-warn' ? '<span class="ai-warn-icon">⚠</span>' : '';
  const sparkle  = '<span class="ai-spark" aria-hidden="true"><span class="sp-big">✦</span><span class="sp-sm">✦</span></span>';
  const chipHtml = hasVal ? `<span class="ai-chip ${chipClass}" title="${tipText}">${sparkle}<span class="chip-text">${esc(dateVal)}</span>${warnIcon}<button class="ai-chip-remove" onclick="event.stopPropagation();removeAiChip('${fieldId}')" title="Remove and edit">×</button></span>` : '';
  return `<div class="field-box" id="fieldbox-${fieldId}" onclick="this.querySelector('input').focus()">${chipHtml}<input id="input-${fieldId}" type="date" value="${hasVal ? esc(dateVal) : ''}"${hasVal ? ' style="display:none"' : ''} oninput="checkSubmitButton()"></div>`;
}

function removeAiChip(fieldId) {
  const box = document.getElementById('fieldbox-' + fieldId);
  if (box) box.querySelector('.ai-chip')?.remove();
  const inp = document.getElementById('input-' + fieldId);
  if (inp) { inp.style.display = ''; inp.focus(); try { inp.select(); } catch(_) {} }
  updateGrandTotal();
  checkSubmitButton();
}

// Disable "Submit for approval" if any mandatory field is missing.
// Mandatory: supplier_id, delivery_date, at least one line item with qty > 0 and price > 0.
function checkSubmitButton() {
  const wrap = document.getElementById('submit-btn-wrap');
  const btn  = wrap?.querySelector('button.btn-submit-appr');
  if (!btn) return;

  const missing = [];
  const suppVal = document.getElementById('input-supplier_id')?.value?.trim();
  if (!suppVal) missing.push('supplier');

  const dateVal = document.getElementById('input-delivery_date')?.value?.trim();
  if (!dateVal) missing.push('delivery date');

  // At least one line item must have both qty > 0 and price > 0.
  const priceInputs = document.querySelectorAll('[id^="input-li-price-"]');
  let hasLine = false;
  priceInputs.forEach(priceInput => {
    const idx = priceInput.id.replace('input-li-price-', '');
    const qty = parseFloat(document.getElementById(`input-li-qty-${idx}`)?.value);
    const price = parseFloat(priceInput.value);
    if (!isNaN(qty) && qty > 0 && !isNaN(price) && price > 0) hasLine = true;
  });
  if (!hasLine) missing.push('at least one priced line item');

  if (missing.length) {
    btn.disabled = true;
    if (wrap) wrap.dataset.tip = `Required: ${missing.join(', ')}`;
  } else {
    btn.disabled = false;
    if (wrap) delete wrap.dataset.tip;
  }
}

function lineItemRow(item, idx, currency, fromAi = true, alertLevel = null, lineConf = null) {
  const p100 = item.price_basis === 'per_100';
  const effectivePrice = p100 && item.unit_price != null ? item.unit_price / 100 : (item.unit_price ?? null);
  const hasQty   = item.quantity != null;
  const hasPrice = effectivePrice != null;
  const lt = hasQty && hasPrice ? item.quantity * effectivePrice : null;

  const descChip  = aiChip(`li-desc-${idx}`,  fromAi && item.description  ? item.description  : null, item.description  ?? '', lineConf, 'text',   '', 'Item description', alertLevel);
  const qtyChip   = aiChip(`li-qty-${idx}`,   fromAi && hasQty             ? item.quantity     : null, item.quantity     ?? '', lineConf, 'number', 'oninput="updateGrandTotal()" step="0.001" min="0" style="text-align:right"', '0', alertLevel);
  const unitChip  = aiChip(`li-unit-${idx}`,  fromAi && item.unit          ? item.unit         : null, item.unit         ?? '', lineConf, 'text',   '', 'pcs', alertLevel);
  const priceChip = aiChip(`li-price-${idx}`, fromAi && hasPrice           ? effectivePrice    : null, effectivePrice    ?? '', lineConf, 'number', 'oninput="updateGrandTotal()" step="0.0001" min="0" style="text-align:right"', '0.00', alertLevel);

  return `<tr class="li-tr" data-row="${idx}">
    <td class="li-td" style="min-width:140px">${descChip}</td>
    <td class="li-td" style="width:80px">${qtyChip}</td>
    <td class="li-td" style="width:60px">${unitChip}</td>
    <td class="li-td" style="width:110px">${priceChip}${p100 ? `<div style="font-size:9px;color:#9ca3af;margin-top:1px">÷100 applied</div>` : ''}</td>
    <td class="li-td li-total-cell" id="li-total-${idx}">${lt != null ? chf(lt) : '—'}</td>
    <td class="li-td" style="width:24px"><button class="li-remove" onclick="this.closest('tr').remove();updateGrandTotal()" title="Remove row">×</button></td>
  </tr>`;
}

function addLineItem() {
  const tbody = document.getElementById('li-tbody');
  if (!tbody) return;
  tbody.insertAdjacentHTML('beforeend', lineItemRow({}, 'new' + Date.now(), '', false));
}

function updateGrandTotal() {
  const tbody = document.getElementById('li-tbody');
  if (!tbody) return;
  const currency = document.getElementById('input-currency')?.value || 'CHF';
  let grand = 0;
  tbody.querySelectorAll('tr.li-tr').forEach(row => {
    const ridx      = row.dataset.row;
    const qty       = parseFloat(document.getElementById(`input-li-qty-${ridx}`)?.value) || 0;
    const price     = parseFloat(document.getElementById(`input-li-price-${ridx}`)?.value) || 0;
    const lt        = qty * price;
    const totalCell = document.getElementById(`li-total-${ridx}`);
    if (totalCell) totalCell.textContent = (qty > 0 && price > 0) ? chf(lt) : '—';
    if (qty > 0 && price > 0) grand += lt;
  });
  const fmt = `${currency} ${chf(grand)}`;
  const grandEl = document.getElementById('li-grand-total');
  if (grandEl) grandEl.textContent = fmt;
  const finEl = document.getElementById('po-financial-total');
  if (finEl) finEl.textContent = fmt;
  checkSubmitButton();
}

function updateCurrency(newCurrency) {
  // Use FX rates from master data (fetched on boot); fall back to hardcoded values.
  const fxRates = window._fxRates || { CHF: 1.0, EUR: 0.96, USD: 0.88, GBP: 1.13 };
  const sel     = document.getElementById('input-currency');
  const prevCurrency = sel?.dataset.prev || newCurrency;

  if (prevCurrency !== newCurrency) {
    // Convert each line item unit price: prevCurrency → CHF → newCurrency
    const prevRate = fxRates[prevCurrency] || 1.0;
    const newRate  = fxRates[newCurrency]  || 1.0;
    const factor   = prevRate / newRate;
    const tbody    = document.getElementById('li-tbody');
    if (tbody) {
      tbody.querySelectorAll('tr.li-tr').forEach(row => {
        const ridx       = row.dataset.row;
        const priceInput = document.getElementById(`input-li-price-${ridx}`);
        if (!priceInput) return;
        const cur = parseFloat(priceInput.value);
        if (!isNaN(cur) && cur !== 0) {
          const converted = Math.round(cur * factor * 10000) / 10000;
          priceInput.value = String(converted);
          // Sync chip display text (shows the live converted value)
          const chipText = priceInput.closest('.field-box')?.querySelector('.chip-text');
          if (chipText) chipText.textContent = String(converted);
        }
      });
    }
  }

  // Record new currency so the next change converts from it
  if (sel) sel.dataset.prev = newCurrency;

  // Sync labels
  const priceHeader = document.getElementById('li-price-header');
  if (priceHeader) priceHeader.textContent = `Unit price (${newCurrency})`;
  const totalLabel = document.getElementById('po-total-label');
  if (totalLabel) totalLabel.innerHTML = `Total (${newCurrency}) <span class="req">*</span>`;

  // Recalculate totals and sync header
  updateGrandTotal();
  const grandTotal   = document.getElementById('li-grand-total');
  const headerTotal  = document.getElementById('detail-header-total-val');
  if (grandTotal && headerTotal) headerTotal.textContent = grandTotal.textContent;
}



// ── Frontend state override and new detail-view functions ─────────────────────
// _detailStatus overrides d.status for rendering; set when the clerk takes action.
let _detailStatus = null;
// Per-approver status in the current view session (idx → 'pending'|'approved'|'rejected')
let _approvalStates = {};
// Alternate approvers assigned by the clerk (idx → {name, email})
let _alternateApprovers = {};
// Which "add alternate" inline forms are currently expanded
let _showAlternateForm = new Set();
// Prevents double-submission when mock approval completes
let _poSubmitted = false;
// Clerk-edited form values captured at "Submit for approval" time, sent to backend on PO creation.
let _clerkFormValues = null;
// Fixable error from the PO submission step (e.g. missing qty/price). Shown as a
// banner in the waiting_approval view with a "Fix data" button that reopens the form.
let _submitError = null;

function renderDetailView(d) {
  // Existing DB rows may still have 'submitted' — treat as approved in the UI.
  const rawStatus = _detailStatus || d.status;
  const status = rawStatus === 'submitted' ? 'approved' : rawStatus;
  const ext = d.extraction, sol = d.resolution;
  const simpleHeader = ['needs_human_review','needs_clarification','security','waiting_approval','approved','rejected'].includes(status);
  // Show chain + readonly PO for all post-submission states
  const showChain    = ['waiting_approval', 'approved', 'rejected'].includes(status);
  const showReadonly = showChain;
  // Section order: header → chain (post-submission) → PO form → original email → LLM calls
  view.innerHTML = `
    <a class="back" href="#/queue">← Back to queue</a>
    ${simpleHeader
      ? detailHeader(status, d, ext, sol)
      : `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
           <div class="page-title" style="margin:0">Requisition #${d.id}</div>${statusBadge(status)}
         </div>
         ${summaryCard(d)}`}
    ${showChain ? (_submitError ? submitErrorBanner(_submitError) : '') + approvalChainSection(d, sol) : ''}
    ${showReadonly ? poFormReadonly(d, ext, sol) : poFormCard(d, ext, sol)}
    ${emailCard(d)}
    ${draftCard(d)}
    ${llmCard(d.llmCalls)}`;
  // Run after DOM is set so checkSubmitButton can find the inputs.
  if (!showReadonly) checkSubmitButton();
}

function detailHeader(status, d, ext, sol) {
  const currency       = ext?.currency || 'CHF';
  const rawTotal       = rawTotalOf(ext);
  const isNeedsReview  = status === 'needs_human_review' || status === 'needs_clarification';
  const isWaiting      = status === 'waiting_approval';
  const isApproved     = status === 'approved';
  const isRejected     = status === 'rejected';
  // Show needs_clarification with the same badge as needs_human_review
  const displayStatus  = status === 'needs_clarification' ? 'needs_human_review' : status;

  const totalBlock = `
    <div class="detail-header-total">
      <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Purchase Order Total</div>
      <div id="detail-header-total-val" style="font-size:20px;font-weight:700;font-family:monospace;color:#111827">${esc(currency)} ${chf(rawTotal)}</div>
    </div>`;

  let rightHtml;
  if (isWaiting) {
    rightHtml = `${totalBlock}
      <div style="font-size:13px;color:#6b7280">Awaiting approver responses</div>`;
  } else if (isApproved) {
    rightHtml = `${totalBlock}
      <div style="font-size:13px;color:#166534;font-weight:600">✓ All approvers approved</div>`;
  } else if (isRejected) {
    rightHtml = `${totalBlock}
      <div style="font-size:13px;color:#991b1b;font-weight:600">✗ Rejected by an approver</div>`;
  } else {
    const clarifyBtn = isNeedsReview
      ? `<button class="ghost" onclick="requestClarification()">Request clarification</button>`
      : '';
    rightHtml = `${totalBlock}
      <div class="detail-header-actions">
        ${clarifyBtn}
        <span id="submit-btn-wrap">
          <button class="btn-submit-appr" onclick="submitForApproval()">Submit for approval</button>
        </span>
      </div>`;
  }

  return `<div class="detail-header">
    <div class="detail-header-meta">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
        <div class="page-title" style="margin:0;font-size:16px">Requisition #${d.id}</div>
        ${statusBadge(displayStatus)}
      </div>
      ${d.email?.subject ? `<div style="font-size:12px;color:#6b7280">${esc(d.email.subject)}</div>` : ''}
      ${(() => {
        const items = (d.reviewItems || []).slice().sort((a, b) => {
          const sev = { security: 0, human: 1, clarification: 2 };
          return (sev[a.queue] ?? 9) - (sev[b.queue] ?? 9);
        });
        return items.length
          ? `<div style="margin-top:5px;display:flex;flex-direction:column;gap:2px">${items.map(it => `<div style="font-size:12px;color:#92400e">⚑ ${esc(it.detail)}</div>`).join('')}</div>`
          : '';
      })()}
    </div>
    <div class="detail-header-right">${rightHtml}</div>
  </div>`;
}

function reRenderDetail(status) {
  _detailStatus = status;
  const d = window._detail;
  if (d) renderDetailView(d);
}

// Opens a mailto pre-filled with the draft reply to the original sender.
function requestClarification() {
  const d = window._detail;
  if (!d) return;
  // from can be a string "Name <email>" or an object {name, address}
  const from = d.email?.from;
  const to   = typeof from === 'string' ? from : (from?.address || '');
  const subj = encodeURIComponent('Re: ' + (d.email?.subject || 'Purchase Requisition'));
  const body = encodeURIComponent(
    d.draftReply || 'Please provide the missing information for your purchase requisition.'
  );
  window.location.href = `mailto:${to}?subject=${subj}&body=${body}`;
}

function submitForApproval() {
  const d = window._detail;
  if (!d) return;
  const status = _detailStatus || d.status;
  const isNeedsReview = status === 'needs_human_review' || status === 'needs_clarification';
  const proceed = async () => {
    // Capture the clerk's current form values NOW, before the form becomes read-only.
    _clerkFormValues = collectFormValues();
    // Persist to DB: status → waiting_approval, re-resolve with clerk overrides.
    // This means delivery date, cost centre, etc. survive navigation and the
    // waiting_approval form shows the correct resolved data.
    try {
      await fetch(`/api/requisition/${d.id}/waiting`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(_clerkFormValues),
      });
      // Re-fetch so window._detail has the freshly resolved data (delivery date,
      // recomputed chain, updated total) before we render the read-only form.
      const fresh = await fetchJson('/api/requisition/' + d.id);
      window._detail = fresh;
    } catch (err) {
      console.warn('Could not persist waiting_approval status:', err);
    }
    reRenderDetail('waiting_approval');
  };
  const isSecurityRisk = status === 'security';
  if (isSecurityRisk) {
    openConfirmModal(
      'Security flag — override required',
      'This requisition has a security flag. By submitting you confirm you have reviewed the flag and take responsibility for proceeding. Continue?',
      proceed
    );
    return;
  }
  if (isNeedsReview) {
    const hasWarnChips = document.querySelectorAll('.ai-chip-warn').length > 0;
    if (hasWarnChips) {
      openConfirmModal(
        'Flagged fields detected',
        'One or more fields are flagged for review or have low confidence. Are you sure you want to submit for approval?',
        proceed
      );
      return;
    }
  }
  proceed();
}

}
